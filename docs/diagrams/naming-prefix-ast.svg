<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="425" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">NamingPrefix Enum - AST Node Types</text>

  <!-- Main enum box -->
  <rect x="275" y="60" width="300" height="50" rx="5" fill="url(#headerGrad)" stroke="#2C5282" stroke-width="2"/>
  <text x="425" y="90" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" fill="white">enum NamingPrefix</text>

  <!-- Connection lines from main enum to variants -->
  <line x1="325" y1="110" x2="110" y2="160" stroke="#555" stroke-width="2"/>
  <line x1="375" y1="110" x2="315" y2="160" stroke="#555" stroke-width="2"/>
  <line x1="475" y1="110" x2="535" y2="160" stroke="#555" stroke-width="2"/>
  <line x1="525" y1="110" x2="740" y2="160" stroke="#555" stroke-width="2"/>

  <!-- Variant 1: Alias -->
  <rect x="25" y="160" width="170" height="130" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <rect x="25" y="160" width="170" height="35" rx="5" fill="#4CAF50"/>
  <rect x="25" y="189" width="170" height="1" fill="#4CAF50"/>
  <text x="110" y="183" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Alias</text>
  <text x="35" y="215" font-family="monospace" font-size="11" fill="#1B5E20">name: String</text>
  <text x="35" y="235" font-family="monospace" font-size="11" fill="#1B5E20">range: Option&lt;Range&gt;</text>
  <rect x="35" y="250" width="150" height="30" rx="3" fill="#C8E6C9"/>
  <text x="110" y="270" font-family="monospace" font-size="10" text-anchor="middle" fill="#2E7D32">"newName:"</text>

  <!-- Variant 2: Spread -->
  <rect x="230" y="160" width="170" height="130" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <rect x="230" y="160" width="170" height="35" rx="5" fill="#FF9800"/>
  <rect x="230" y="189" width="170" height="1" fill="#FF9800"/>
  <text x="315" y="183" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Spread</text>
  <text x="240" y="215" font-family="monospace" font-size="11" fill="#E65100">range: Option&lt;Range&gt;</text>
  <rect x="240" y="235" width="150" height="30" rx="3" fill="#FFE0B2"/>
  <text x="315" y="255" font-family="monospace" font-size="10" text-anchor="middle" fill="#E65100">"..." (anonymous)</text>
  <text x="315" y="280" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#BF360C">For spreading paths</text>

  <!-- Variant 3: SpreadNamed (highlighted as new) -->
  <rect x="450" y="155" width="170" height="145" rx="5" fill="#E3F2FD" stroke="#2196F3" stroke-width="3"/>
  <rect x="450" y="155" width="170" height="35" rx="5" fill="#2196F3"/>
  <rect x="450" y="184" width="170" height="1" fill="#2196F3"/>
  <text x="535" y="178" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="white">SpreadNamed</text>
  <text x="460" y="210" font-family="monospace" font-size="11" fill="#0D47A1">name: String</text>
  <text x="460" y="230" font-family="monospace" font-size="11" fill="#0D47A1">range: Option&lt;Range&gt;</text>
  <rect x="460" y="245" width="150" height="30" rx="3" fill="#BBDEFB"/>
  <text x="535" y="265" font-family="monospace" font-size="10" text-anchor="middle" fill="#1565C0">"...TypeName"</text>
  <text x="535" y="290" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#0D47A1">V0.4+ only</text>

  <!-- NEW badge -->
  <rect x="595" y="145" width="35" height="18" rx="3" fill="#F44336"/>
  <text x="612" y="157" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">NEW</text>

  <!-- Variant 4: None -->
  <rect x="655" y="160" width="170" height="130" rx="5" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="2"/>
  <rect x="655" y="160" width="170" height="35" rx="5" fill="#9E9E9E"/>
  <rect x="655" y="189" width="170" height="1" fill="#9E9E9E"/>
  <text x="740" y="183" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="white">None</text>
  <text x="665" y="215" font-family="Arial, sans-serif" font-size="11" fill="#424242">(no fields)</text>
  <rect x="665" y="235" width="150" height="30" rx="3" fill="#E0E0E0"/>
  <text x="740" y="255" font-family="monospace" font-size="10" text-anchor="middle" fill="#616161">fieldName</text>
  <text x="740" y="280" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#757575">Uses field name as-is</text>

  <!-- Usage examples section -->
  <rect x="50" y="320" width="750" height="160" rx="8" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="2"/>
  <text x="425" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">Usage Examples in Selection Strings</text>

  <!-- Example table -->
  <text x="80" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">Syntax</text>
  <text x="280" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">NamingPrefix</text>
  <text x="480" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">Description</text>

  <line x1="70" y1="385" x2="780" y2="385" stroke="#E0E0E0" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="80" y="405" font-family="monospace" font-size="11" fill="#333">userName: user.name</text>
  <text x="280" y="405" font-family="monospace" font-size="11" fill="#4CAF50">Alias { name: "userName" }</text>
  <text x="480" y="405" font-family="Arial, sans-serif" font-size="11" fill="#666">Rename field in output</text>

  <!-- Row 2 -->
  <text x="80" y="430" font-family="monospace" font-size="11" fill="#333">...path.to.data</text>
  <text x="280" y="430" font-family="monospace" font-size="11" fill="#FF9800">Spread</text>
  <text x="480" y="430" font-family="Arial, sans-serif" font-size="11" fill="#666">Spread path contents inline</text>

  <!-- Row 3 (highlighted) -->
  <rect x="70" y="440" width="720" height="25" rx="3" fill="#E3F2FD"/>
  <text x="80" y="458" font-family="monospace" font-size="11" fill="#333">...User</text>
  <text x="280" y="458" font-family="monospace" font-size="11" fill="#2196F3">SpreadNamed { name: "User" }</text>
  <text x="480" y="458" font-family="Arial, sans-serif" font-size="11" fill="#1565C0">Reference @mapping definition</text>

  <!-- Row 4 -->
  <text x="80" y="480" font-family="monospace" font-size="11" fill="#333">id name email</text>
  <text x="280" y="480" font-family="monospace" font-size="11" fill="#9E9E9E">None (for each field)</text>
  <text x="480" y="480" font-family="Arial, sans-serif" font-size="11" fill="#666">Use JSON field name as-is</text>
</svg>
