<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">SpreadNamed Processing Flow</text>

  <!-- Actor boxes -->
  <rect x="60" y="50" width="120" height="40" rx="5" fill="#E8F4FD" stroke="#2196F3" stroke-width="2"/>
  <text x="120" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">Schema (SDL)</text>

  <rect x="260" y="50" width="120" height="40" rx="5" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="320" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">Parser</text>

  <rect x="460" y="50" width="140" height="40" rx="5" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="530" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">MappingRegistry</text>

  <rect x="700" y="50" width="120" height="40" rx="5" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  <text x="760" y="75" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#AD1457">Apply (JSON)</text>

  <!-- Lifelines -->
  <line x1="120" y1="90" x2="120" y2="650" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="320" y1="90" x2="320" y2="650" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="530" y1="90" x2="530" y2="650" stroke="#4CAF50" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="760" y1="90" x2="760" y2="650" stroke="#E91E63" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Step 1: @mapping directives -->
  <line x1="120" y1="130" x2="310" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="125" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">1. @mapping directives</text>

  <!-- Step 2: Build registry -->
  <line x1="320" y1="170" x2="520" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">2. Build registry</text>

  <!-- Registry building box -->
  <rect x="470" y="190" width="180" height="120" rx="3" fill="#F1F8E9" stroke="#8BC34A" stroke-width="1"/>
  <text x="560" y="210" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#558B2F">For each @mapping:</text>
  <text x="480" y="230" font-family="monospace" font-size="9" fill="#33691E">• Parse selection OR</text>
  <text x="480" y="248" font-family="monospace" font-size="9" fill="#33691E">• Auto-generate from fields</text>
  <text x="480" y="266" font-family="monospace" font-size="9" fill="#33691E">• Validate no method calls</text>
  <text x="480" y="284" font-family="monospace" font-size="9" fill="#33691E">• Store by alias name</text>

  <!-- Step 3: @connect selection -->
  <line x1="120" y1="340" x2="310" y2="340" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="215" y="335" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">3. @connect selection</text>

  <!-- Step 4: Parse selection -->
  <line x1="320" y1="380" x2="520" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="375" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">4. Parse "...User email"</text>

  <!-- AST box -->
  <rect x="265" y="400" width="150" height="80" rx="3" fill="#FFF8E1" stroke="#FFC107" stroke-width="1"/>
  <text x="340" y="420" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#FF8F00">Creates AST:</text>
  <text x="275" y="440" font-family="monospace" font-size="9" fill="#E65100">SubSelection {</text>
  <text x="280" y="455" font-family="monospace" font-size="9" fill="#E65100">  [SpreadNamed "User"]</text>
  <text x="280" y="470" font-family="monospace" font-size="9" fill="#E65100">  [None "email"]</text>

  <!-- Step 5: expand_selection -->
  <line x1="320" y1="500" x2="520" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="495" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">5. expand_selection()</text>

  <!-- Expand box -->
  <rect x="470" y="510" width="180" height="55" rx="3" fill="#F1F8E9" stroke="#8BC34A" stroke-width="1"/>
  <text x="480" y="530" font-family="monospace" font-size="9" fill="#33691E">Lookup "User" in registry</text>
  <text x="480" y="548" font-family="monospace" font-size="9" fill="#33691E">Inline: [None "id"],</text>
  <text x="550" y="558" font-family="monospace" font-size="9" fill="#33691E">[None "name"]</text>

  <!-- Step 5 return -->
  <line x1="520" y1="580" x2="330" y2="580" stroke="#666" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-return)"/>
  <text x="425" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#666">Expanded AST</text>

  <!-- Step 6: apply_to -->
  <line x1="530" y1="610" x2="750" y2="610" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="640" y="605" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#333">6. apply_to(json)</text>

  <!-- Step 6 return -->
  <line x1="750" y1="640" x2="540" y2="640" stroke="#666" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-return)"/>
  <text x="645" y="655" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#666">{"id": 1, "name": "Alice", "email": "a@b.c"}</text>

  <!-- Legend -->
  <rect x="30" y="660" width="200" height="30" rx="3" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
  <line x1="45" y1="675" x2="75" y2="675" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="85" y="679" font-family="Arial, sans-serif" font-size="10" fill="#666">Request</text>
  <line x1="135" y1="675" x2="165" y2="675" stroke="#666" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead-return)"/>
  <text x="175" y="679" font-family="Arial, sans-serif" font-size="10" fill="#666">Response</text>
</svg>
