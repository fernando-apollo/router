<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#333">Data Flow: ...TypeName Spread Processing</text>

  <!-- Input Schema Box -->
  <rect x="50" y="60" width="700" height="150" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1565C0">Input Schema (SDL)</text>
  <text x="70" y="110" font-family="monospace" font-size="11" fill="#0D47A1">type User @mapping {</text>
  <text x="70" y="126" font-family="monospace" font-size="11" fill="#0D47A1">  id: ID!</text>
  <text x="70" y="142" font-family="monospace" font-size="11" fill="#0D47A1">  name: String!</text>
  <text x="70" y="158" font-family="monospace" font-size="11" fill="#0D47A1">}</text>

  <text x="350" y="110" font-family="monospace" font-size="11" fill="#0D47A1">type Query {</text>
  <text x="350" y="126" font-family="monospace" font-size="11" fill="#0D47A1">  users: [User!]! @connect(</text>
  <text x="350" y="142" font-family="monospace" font-size="11" fill="#0D47A1">    source: "api"</text>
  <text x="350" y="158" font-family="monospace" font-size="11" fill="#0D47A1">    http: { GET: "/users" }</text>
  <text x="350" y="174" font-family="monospace" font-size="11" fill="#0D47A1">    selection: "$ { ...User email }"</text>
  <text x="350" y="190" font-family="monospace" font-size="11" fill="#0D47A1">  )</text>
  <text x="350" y="202" font-family="monospace" font-size="11" fill="#0D47A1">}</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="215" x2="400" y2="250" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 1: Build MappingRegistry -->
  <rect x="50" y="260" width="700" height="130" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2E7D32">Step 1: Build MappingRegistry</text>
  <text x="70" y="310" font-family="monospace" font-size="11" fill="#1B5E20">mappings: {</text>
  <text x="70" y="328" font-family="monospace" font-size="11" fill="#1B5E20">  "User" => MappingDefinition {</text>
  <text x="70" y="346" font-family="monospace" font-size="11" fill="#1B5E20">    selection: SubSelection { [None "id"], [None "name"] },</text>
  <text x="70" y="364" font-family="monospace" font-size="11" fill="#1B5E20">    source_type: "User"</text>
  <text x="70" y="380" font-family="monospace" font-size="11" fill="#1B5E20">  }</text>
  <text x="70" y="396" font-family="monospace" font-size="11" fill="#1B5E20">}</text>

  <!-- Annotation for auto-generated -->
  <rect x="530" y="338" width="200" height="25" rx="3" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1"/>
  <text x="630" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2E7D32">Auto-generated from field names</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="395" x2="400" y2="430" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Parse @connect selection -->
  <rect x="50" y="440" width="700" height="110" rx="8" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="400" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#E65100">Step 2: Parse @connect selection "$ { ...User email }"</text>
  <text x="70" y="495" font-family="monospace" font-size="11" fill="#BF360C">JSONSelection {</text>
  <text x="70" y="513" font-family="monospace" font-size="11" fill="#BF360C">  inner: TopLevelSelection::Named(</text>
  <text x="70" y="531" font-family="monospace" font-size="11" fill="#BF360C">    SubSelection { [SpreadNamed("User")], [None "email"] }</text>
  <text x="70" y="549" font-family="monospace" font-size="11" fill="#BF360C">  )</text>
  <text x="70" y="564" font-family="monospace" font-size="11" fill="#BF360C">}</text>

  <!-- Reference annotation -->
  <rect x="430" y="523" width="180" height="25" rx="3" fill="#FFECB3" stroke="#FFB300" stroke-width="1"/>
  <text x="520" y="540" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#E65100">SpreadNamed = Reference to @mapping</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="555" x2="400" y2="590" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Expand spread references -->
  <rect x="50" y="600" width="700" height="110" rx="8" fill="#F3E5F5" stroke="#7B1FA2" stroke-width="2"/>
  <text x="400" y="625" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#6A1B9A">Step 3: Expand spread references</text>
  <text x="70" y="655" font-family="monospace" font-size="11" fill="#4A148C">JSONSelection {</text>
  <text x="70" y="673" font-family="monospace" font-size="11" fill="#4A148C">  inner: TopLevelSelection::Named(</text>
  <text x="70" y="691" font-family="monospace" font-size="11" fill="#4A148C">    SubSelection { [None "id"], [None "name"], [None "email"] }</text>
  <text x="70" y="707" font-family="monospace" font-size="11" fill="#4A148C">  )</text>
  <text x="70" y="722" font-family="monospace" font-size="11" fill="#4A148C">}</text>

  <!-- Inlined annotation -->
  <rect x="430" y="683" width="150" height="25" rx="3" fill="#E1BEE7" stroke="#AB47BC" stroke-width="1"/>
  <text x="505" y="700" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#6A1B9A">Inlined from @mapping</text>

  <!-- Arrow 4 -->
  <line x1="400" y1="715" x2="400" y2="750" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Apply to JSON -->
  <rect x="50" y="760" width="700" height="120" rx="8" fill="#FCE4EC" stroke="#C2185B" stroke-width="2"/>
  <text x="400" y="785" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#AD1457">Step 4: Apply to JSON response</text>

  <!-- Input JSON -->
  <rect x="70" y="800" width="280" height="60" rx="3" fill="#FFCDD2" stroke="#EF5350" stroke-width="1"/>
  <text x="80" y="820" font-family="monospace" font-size="10" fill="#B71C1C">Input: {"id": 1, "name": "Alice",</text>
  <text x="80" y="838" font-family="monospace" font-size="10" fill="#B71C1C">"email": "a@b.c", "internal": "hidden"}</text>

  <!-- Arrow between input and output -->
  <line x1="360" y1="830" x2="430" y2="830" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output JSON -->
  <rect x="450" y="800" width="280" height="60" rx="3" fill="#C8E6C9" stroke="#66BB6A" stroke-width="1"/>
  <text x="460" y="820" font-family="monospace" font-size="10" fill="#1B5E20">Result: {"id": 1,</text>
  <text x="460" y="838" font-family="monospace" font-size="10" fill="#1B5E20">"name": "Alice", "email": "a@b.c"}</text>
  <text x="590" y="855" font-family="Arial, sans-serif" font-size="9" fill="#2E7D32">"internal" filtered out</text>
</svg>
