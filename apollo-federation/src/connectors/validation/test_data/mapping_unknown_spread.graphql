extend schema
  @link(
    url: "https://specs.apollo.dev/connect/v0.5"
    import: ["@connect", "@source", "@mapping"]
  )
  @source(name: "api", http: { baseURL: "http://127.0.0.1" })

type Query {
  pet(id: ID!): Pet
    @connect(
      source: "api"
      http: { GET: "/pets/{$args.id}" }
      selection: "...Missing"
    )
}

type Pet {
  id: ID!
  name: String
}
